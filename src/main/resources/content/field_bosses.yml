# 돈은 실버로 적는다 (소수 가능: 0.3 = 30쿠퍼). 게임 안에서는 1골드 = 100실버 = 10000쿠퍼 (domain.economy.Money)
# 필드 보스 (BOS-03). 이름 · 생김새 · 능력 · 원작 드롭은 나무위키 「로열 로드/보스 몬스터」 본문 (2026-10 사용자 제공, CANON).
# 원작에 나온 곳이 이 지도에 있으면 그곳에, 없으면 성격이 맞는 지역에 둥지를 둔다 (설명에 원작 장소를 적었다). 체력 · 패턴 수치 · 드롭 확률은 ORIGINAL.
# 본문 56 항목 가운데 넣지 않은 것: 바르칸 데모프의 소환체 (같은 바르칸이 지팡이 권능으로 잠시 소환된 모습 — 따로 넣지 않음)
# 둥지(region) 64 블록 안에 사람이 오면 나타나고, 쓰러지면 respawn_minutes 뒤 다시 나타난다.
# mechanics: REGEN(재생) · MINIONS(부하 소환) · FEAR(공포: 둔화 · 나약) · VESSEL(생명의 그릇: 그릇을 먼저 부수지 않으면 한 번 되살아남)
#            ENRAGE(체력 30% 아래 광폭) · BREATH(앞쪽으로 숨결) · FLIGHT(공중 도약 · 순간 이동)
# look: 리소스팩 모델 모양 · size: 보이는 크기 배율 (판정은 바닐라 몸 그대로)
# drops: "아이템:품질:확률" — 가장 많이 때린 사람에게. reward: 기여 10% 이상인 사람마다
