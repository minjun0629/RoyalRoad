# 시장 · 시세 · NPC 상점 — 모두 ORIGINAL. 원작의 화폐 단위 · 물가는 쓰지 않는다 (단위: 골드).
# markets: 지역 시장. cheap 태그는 그 지역에서 흔해 싸고, dear 태그는 귀해 비싸다.
markets:
  harden:      {name: 하르덴 대시장,  region: harden,           tax: 0.05, cheap: [grain, food, cloth], dear: [frost, sky, gem]}
  rosaim:      {name: 로자임 부두 시장, region: rosaim_harbor,  tax: 0.04, cheap: [fish, seasoning, deep], dear: [stone, marble, ore]}
  morata:      {name: 모라타 장인 거리, region: morata_free_city, tax: 0.05, cheap: [stone, marble, dye], dear: [fish, seasoning]}
  deep_hammer: {name: 깊은 망치 교역소, region: thor_deep_hammer, tax: 0.06, cheap: [ore, metal, mineral], dear: [food, fiber, herb]}
  azil:        {name: 아질 오아시스 장터, region: azil_oasis,    tax: 0.05, cheap: [sand, glass, herb], dear: [wood, fish]}
  despair:     {name: 절망의 평원 뒷거래, region: plains_of_despair, tax: 0.15, cheap: [gem, metal], dear: [food, potion]}
  risvel:      {name: 리스벨 개척 창고, region: risvel_outpost, tax: 0.03, cheap: [hide, wood], dear: [metal, cloth, potion]}

