# 연대기 (/연대기). 원작 시대는 나무위키 「로열 로드」 §6.1 (CANON), 그 뒤는 이 게임의 후대 (ORIGINAL — 02_WORLD §1)
eras:
  dawn:      {name: 여명의 시대,   when: "10억 8천만 년 전 ~ 10억 년 전", source: CANON,
              summary: "대륙이 갓 만들어져 신의 힘이 널리 퍼졌다. 자연이 자리 잡자 몬스터와 종족이 생기고 드래곤과 몬스터의 힘이 퍼졌다"}
  four_races: {name: 네 종족의 시대, when: "10억 년 전 ~ 수천 년 전", source: CANON,
              summary: "동굴에 숨어 살던 인간 · 엘프 · 드워프 · 오크가 처음으로 도시 라체부르그를 세웠다가, 갈라져 각자의 땅을 이뤘다"}
  classic:   {name: 고전 시대,     when: "1000년 전 ~ 700년 전", source: CANON,
              summary: "게이하르 폰 아르펜이 대륙을 하나로 묶어 아르펜 제국을 세웠으나, 그가 죽은 뒤 300년을 못 버티고 수십 나라로 갈라졌다"}
  war:       {name: 전쟁의 시대,   when: "700년 전 ~ 680년 전", source: CANON,
              summary: "작센 섬 상륙 작전으로 힘의 균형이 무너져 전쟁이 이어졌다. 소국들이 살아남으려고 브리튼 연합을 만들었고, 켈튼은 칼라모르 제국, 베이너는 하벤 왕국이 되었다"}
  chaos:     {name: 혼돈의 시대,   when: "약 500년 전부터", source: CANON,
              summary: "탐욕스러운 왕들의 전쟁과 마족과 계약한 흑마법사들. 교단들이 성물을 빼앗겼다. 바르칸 데모프가 날뛰었고, 절망의 평원 주민은 이때 추방된 사람들의 후손이다"}
  romance:   {name: 낭만 시대,     when: "350년 전 ~ 150년 전", source: CANON,
              summary: "북부에 니플하임 제국이 서고 200년 평화를 누렸으나, 엠비뉴 교단의 음모로 몰락했다. 마지막 황제는 센데임 계곡에서 세르비안의 깨진 구슬로 몬스터와 함께 사라졌다"}
  arpen:     {name: 아르펜 제국,   when: "원작의 현재", source: CANON,
              summary: "모라타에서 시작한 아르펜 왕국이 하벤 제국과의 전쟁에서 이겨 제국이 되었다"}
  ashen:     {name: 잿빛 겨울,     when: "원작 이후 수백 년", source: ORIGINAL,
              summary: "이 게임의 후대. 잿빛 겨울로 북부가 다시 비고, 여러 왕국이 무너지거나 이름만 남았다"}
  versa_dawn: {name: 베르사 새벽기, when: "지금 (개척력 37년)", source: ORIGINAL,
              summary: "개척민이 돌아와 옛 도시를 다시 세우는 시대. 여러분이 시작하는 때"}
