# 들판 몬스터 (WLD-05). 사람 둘레 18 ~ 32 블록, 도시 성벽 밖에 나온다 (FieldMobRuntime).
# 이름: source CANON = 원작(소설 『달빛조각사』의 게임 로열 로드)에 나온 몬스터 — 나무위키 「달빛조각사/연표」 · 「로열 로드/보스 몬스터」,
#       Legendary Moonlight Sculptor Wiki 「Monsters」 · 「Category:Monster」 검색 요약 (01_RESEARCH.md §6).
#       SOURCE-BASED = 원작 종족(오크 · 다크엘프 …)에 이 게임이 붙인 병종 · ORIGINAL = 이 게임의 것.
