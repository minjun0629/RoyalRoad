# regions: 원작 서식지 (그 지역 · 아래 지역에서 4 배 자주) · tags + danger: 지역 태그가 맞고 위험도가 범위 안이면 ("any" = 모든 땅)
# hostile: 먼저 덤빈다 (false = 맞으면 반격) · drops: "아이템:확률[:개수]" (품질은 레벨만큼) · kinds: 속성 추가 피해 판정
