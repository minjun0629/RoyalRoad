# 비기 (ART-01). 이름은 나무위키 「로열 로드」 §6 본문에 나온 것 (CANON). 배우는 방법 · 효과 수치는 이 게임의 것.
# 원작: 마스터 직전에 만드는 최상급 스킬. 비기에 관련된 물건(조각사는 조각상)으로 배우거나 스스로 깨우친다(정령창조 조각술).
#       직업의 비기를 모두 모으면 최후의 비기 — 조각사: 시간 조작(초급 시간 가속 · 중급 시간 정지 · 고급 시간 여행), 요리사: 천상의 맛.
# 화가의 '대륙 창조'는 이 게임에 화가 직업이 없어 넣지 않았다.
# relic: 손에 들고 배우면 사라지는 조각상 (던전의 숨은 보상) · discover: 스스로 깨우치는 조건 · cooldown_minutes: 다시 쓰기까지
arts:
  sculpt_life:
    name: 조각 생명술
    job: sculptor
    discipline: sculpting
    min_level: 25
    relic: relic_life_statue
    discover: {counter: craft.sculpting, at_least: 1500}
    effect: COMPANION
    cooldown_minutes: 30
    description: "손에 든 조각품에 생명을 불어넣는다 — 품질만큼 오래 곁에서 싸우는 조각 생명체 (조각품은 사라진다)"
  sculpt_transform:
    name: 조각 변신술
    job: sculptor
    discipline: sculpting
    min_level: 25
    relic: relic_transform_statue
    discover: {counter: art.experience, at_least: 2000}
    effect: TRANSFORM
    cooldown_minutes: 20
    description: "5분 동안 조각한 몸으로 변한다 — 힘 · 속도 · 도약이 오르고 이름이 가려진다. 변신 중에 쌓은 악명은 풀려도 남는다"
  sculpt_revival:
    name: 조각 부활술
    job: sculptor
    discipline: sculpting
    min_level: 27
    relic: relic_revival_statue
    effect: REVIVE
    cooldown_minutes: 60
    description: "10분 동안 나와 16 블록 안 파티원에게 부활의 가호 — 죽을 피해를 한 번 버티고 체력 절반으로 일어선다"
  spirit_creation:
    name: 정령창조 조각술
    job: sculptor
    discipline: sculpting
    min_level: 28
    discover: {all: [{counter: craft.sculpting, at_least: 3000}, {mastery: exploration, level: 15}]}
    effect: SPIRITS
    cooldown_minutes: 30
    description: "자연을 깎아 정령 셋을 만든다 — 10분 동안 나를 따라 싸운다 (원작: 위드가 스스로 깨우친 비기)"
  time_sculpting:
    name: 시간 조각술 (최후의 비기)
    job: sculptor
    discipline: sculpting
    min_level: 29
    final: true
    effect: TIME
    cooldown_minutes: 60
    description: "조각사의 최후의 비기. 숙련 29 초급 시간 가속(파티 1분 가속) · 30 중급 시간 정지(주변 몬스터 8초 정지) · 31 고급 시간 여행(1분 전 자리로)"
  heavenly_taste:
    name: 천상의 맛 (최후의 비기)
    job: cook
    discipline: cooking
    min_level: 31
    final: true
    discover: {counter: craft.cooking, at_least: 2000}
    effect: FEAST
    cooldown_minutes: 1440
    description: "요리사의 최후의 비기. 16 블록 안 모두에게 5분 동안 포만 · 재생 · 흡수, 먹은 사람은 하루에 한 번 인내 기록 +200 (영구 스탯)"
  # ---- 추가 비기 (이름 CANON — 나무위키 「로열 로드/스킬」 사용자 제공 본문. 배우는 조건 · 수치는 ORIGINAL)
  sculpting_swordsmanship:
    name: 조각 검술
    job: sculptor
    discipline: sculpting
    min_level: 20
    discover: {all: [{counter: craft.sculpting, at_least: 800}, {mastery: swordsmanship, level: 10}]}
    effect: BLADE
    cooldown_minutes: 2
    description: "조각칼로 허공을 깎듯 벤다 — 앞쪽 7 블록 부채꼴에 (12 + 예술 스탯 × 0.5) 피해"
  nature_sculpting:
    name: 대재앙의 자연조각술
    job: sculptor
    discipline: sculpting
    min_level: 27
    discover: {all: [{counter: craft.sculpting, at_least: 4000}, {mastery: exploration, level: 18}]}
    effect: DISASTER
    cooldown_minutes: 120
    description: "자연을 조각해 재앙을 부른다 — 30초 동안 폭풍, 주위 16 블록 몬스터에게 벼락 여섯 번 (건물 · 땅은 부수지 않음)"
  radiant_sword:
    name: 광휘의 검술
    job: swordsman
    discipline: swordsmanship
    min_level: 18
    discover: {all: [{mastery: swordsmanship, level: 18}, {counter: kill.monster, at_least: 3000}]}
    effect: RADIANT
    cooldown_minutes: 3
    description: "빛줄기 같은 일격 — 앞으로 14 블록 직선 위 모두에게 큰 피해, 언데드 · 악마는 두 배"
  split_sword:
    name: 분검술
    job: swordsman
    discipline: swordsmanship
    min_level: 22
    discover: {all: [{mastery: swordsmanship, level: 22}, {counter: hit.training, at_least: 5000}]}
    effect: SPLIT
    cooldown_minutes: 4
    description: "검을 여럿으로 나눠 휘두른다 — 주위 6 블록 모두를 세 번 벤다"
  honorable_oath:
    name: 명예로운 약속
    job: swordsman
    discipline: swordsmanship
    min_level: 20
    discover: {all: [{mastery: swordsmanship, level: 20}, {counter: fame, at_least: 1000}]}
    effect: OATH
    cooldown_minutes: 10
    description: "동료와 맹세한다 — 16 블록 안 파티원 1분 동안 힘 · 저항"
  the_other_sword:
    name: 다른 하나의 검
    job: swordsman
    discipline: swordsmanship
    min_level: 25
    discover: {all: [{mastery: swordsmanship, level: 25}, {counter: boss.field, at_least: 10}]}
    effect: TWIN
    cooldown_minutes: 15
    description: "보이지 않는 두 번째 검 — 30초 동안 내 근접 공격이 한 번 더 들어간다 (절반 피해)"
  # ---- 직업마다 열 가지가 되도록 더한 비기 (이름 · 조건 · 수치 ORIGINAL). BUFF · STRIKE 는 params 로 모양을 정한다
  #   BUFF   params: potions [효과:세기:초 …] · target self | party | near
  #   STRIKE params: shape cone | line | circle · range · damage · level_bonus(숙련마다) · art_bonus(예술마다) · hits · interval(틱) · slow(초)
  moonlight_veil:
    name: 달빛 조각술
    job: sculptor
    discipline: sculpting
    min_level: 12
    discover: {all: [{counter: craft.sculpting, at_least: 300}, {counter: art.experience, at_least: 300}]}
    effect: BUFF
    params: {target: self, potions: ["NIGHT_VISION:0:600", "LUCK:1:600", "SPEED:0:600"]}
    cooldown_minutes: 20
    source: ORIGINAL
    description: "달빛을 깎아 몸에 두른다 — 10분 동안 밤눈 · 행운 · 빠른 걸음"
  light_sculpture:
    name: 빛의 조각술
    job: sculptor
    discipline: sculpting
    min_level: 18
    discover: {all: [{counter: craft.sculpting, at_least: 1000}, {counter: art.created, at_least: 3}]}
    effect: BUFF
    params: {target: party, potions: ["REGENERATION:0:180", "GLOWING:0:180", "DAMAGE_RESISTANCE:0:180"]}
    cooldown_minutes: 15
    source: ORIGINAL
    description: "빛으로 조각한 형상이 파티를 감싼다 — 16 블록 안 파티원 3분 동안 재생 · 저항 (빛나 보인다)"
  frost_sculpture:
    name: 얼음 조각술
    job: sculptor
    discipline: sculpting
    min_level: 22
    discover: {all: [{counter: craft.sculpting, at_least: 2000}, {mastery: exploration, level: 10}]}
    effect: STRIKE
    params: {shape: circle, range: 7, damage: 14, art_bonus: 0.4, hits: 1, slow: 6}
    cooldown_minutes: 3
    source: ORIGINAL
    description: "주위의 공기를 얼려 깎는다 — 7 블록 안 적에게 피해, 6초 동안 느리게"
  sword_wave:
    name: 검기
    job: swordsman
    discipline: swordsmanship
    min_level: 8
    discover: {all: [{mastery: swordsmanship, level: 8}, {counter: hit.training, at_least: 1000}]}
    effect: STRIKE
    params: {shape: line, range: 10, damage: 12, level_bonus: 0.6}
    cooldown_minutes: 1
    source: ORIGINAL
    description: "검을 휘둘러 기운을 날린다 — 앞으로 10 블록 직선에 피해"
  whirlwind:
    name: 회오리 베기
    job: swordsman
    discipline: swordsmanship
    min_level: 12
    discover: {all: [{mastery: swordsmanship, level: 12}, {counter: kill.monster, at_least: 800}]}
    effect: STRIKE
    params: {shape: circle, range: 5, damage: 9, level_bonus: 0.4, hits: 2, interval: 8}
    cooldown_minutes: 2
    source: ORIGINAL
    description: "몸을 돌려 두 번 벤다 — 주위 5 블록"
  iron_skin:
    name: 강철 피부
    job: swordsman
    discipline: swordsmanship
    min_level: 14
    discover: {all: [{mastery: swordsmanship, level: 14}, {counter: hit_taken, at_least: 2000}]}
    effect: BUFF
    params: {target: self, potions: ["DAMAGE_RESISTANCE:1:30"]}
    cooldown_minutes: 5
    source: ORIGINAL
    description: "숨을 멈추고 몸을 굳힌다 — 30초 동안 받는 피해가 크게 준다"
  battle_focus:
    name: 전장의 집중
    job: swordsman
    discipline: swordsmanship
    min_level: 16
    discover: {all: [{mastery: swordsmanship, level: 16}, {counter: boss.field, at_least: 3}]}
    effect: BUFF
    params: {target: self, potions: ["INCREASE_DAMAGE:1:45", "SPEED:1:45"]}
    cooldown_minutes: 5
    source: ORIGINAL
    description: "주위가 느려 보인다 — 45초 동안 힘 · 속도"
  thousand_cuts:
    name: 천 번의 베기
    job: swordsman
    discipline: swordsmanship
    min_level: 24
    discover: {all: [{mastery: swordsmanship, level: 24}, {counter: hit.training, at_least: 10000}]}
    effect: STRIKE
    params: {shape: cone, range: 6, damage: 6, level_bonus: 0.3, hits: 6, interval: 3}
    cooldown_minutes: 4
    source: ORIGINAL
    description: "눈에 보이지 않을 만큼 빠르게 — 앞쪽 부채꼴을 여섯 번 벤다"
  sword_rain:
    name: 검의 비
    job: swordsman
    discipline: swordsmanship
    min_level: 28
    discover: {all: [{mastery: swordsmanship, level: 28}, {counter: kill.monster, at_least: 8000}]}
    effect: STRIKE
    params: {shape: circle, range: 9, damage: 10, level_bonus: 0.5, hits: 5, interval: 10}
    cooldown_minutes: 10
    source: ORIGINAL
    description: "하늘에서 검이 쏟아진다 — 주위 9 블록에 다섯 번"
  hearty_table:
    name: 든든한 한상
    job: cook
    discipline: cooking
    min_level: 5
    discover: {counter: craft.cooking, at_least: 100}
    effect: BUFF
    params: {target: near, potions: ["SATURATION:0:5", "REGENERATION:0:120"]}
    cooldown_minutes: 30
    source: ORIGINAL
    description: "근처 모두에게 한상 차린다 — 배부름 · 2분 동안 재생"
  travelers_lunch:
    name: 여행자의 도시락
    job: cook
    discipline: cooking
    min_level: 8
    discover: {counter: craft.cooking, at_least: 200}
    effect: BUFF
    params: {target: party, potions: ["SPEED:0:600", "SATURATION:0:3"]}
    cooldown_minutes: 30
    source: ORIGINAL
    description: "길 위에서 먹는 도시락 — 파티 10분 동안 빠른 걸음"
  night_snack:
    name: 밤참
    job: cook
    discipline: cooking
    min_level: 10
    discover: {counter: craft.cooking, at_least: 350}
    effect: BUFF
    params: {target: party, potions: ["NIGHT_VISION:0:600", "SATURATION:0:3"]}
    cooldown_minutes: 30
    source: ORIGINAL
    description: "늦은 밤의 따뜻한 국 — 파티 10분 동안 밤눈"
  herbal_tea:
    name: 약초차
    job: cook
    discipline: cooking
    min_level: 12
    discover: {all: [{counter: craft.cooking, at_least: 500}, {mastery: herbalism, level: 5}]}
    effect: BUFF
    params: {target: party, potions: ["REGENERATION:1:60"]}
    cooldown_minutes: 15
    source: ORIGINAL
    description: "쓴 약초를 달여 낸다 — 파티 1분 동안 강한 재생"
  spicy_stew:
    name: 매운 탕
    job: cook
    discipline: cooking
    min_level: 15
    discover: {counter: craft.cooking, at_least: 700}
    effect: BUFF
    params: {target: party, potions: ["FIRE_RESISTANCE:0:300", "INCREASE_DAMAGE:0:300"]}
    cooldown_minutes: 30
    source: ORIGINAL
    description: "입에서 불이 난다 — 파티 5분 동안 불 견딤 · 힘"
  sea_banquet:
    name: 바다 만찬
    job: cook
    discipline: cooking
    min_level: 17
    discover: {all: [{counter: craft.cooking, at_least: 900}, {mastery: fishing, level: 8}]}
    effect: BUFF
    params: {target: party, potions: ["WATER_BREATHING:0:600", "DOLPHINS_GRACE:0:300"]}
    cooldown_minutes: 30
    source: ORIGINAL
    description: "갓 잡은 생선으로 차린 만찬 — 파티 물속 숨쉬기 · 빠른 헤엄"
  warriors_meat:
    name: 전사의 고기
    job: cook
    discipline: cooking
    min_level: 20
    discover: {all: [{counter: craft.cooking, at_least: 1200}, {mastery: butchery, level: 5}]}
    effect: BUFF
    params: {target: party, potions: ["INCREASE_DAMAGE:1:300", "ABSORPTION:1:300"]}
    cooldown_minutes: 45
    source: ORIGINAL
    description: "두툼하게 구운 고기 — 파티 5분 동안 강한 힘 · 보호막"
  frost_soup:
    name: 얼음 수프
    job: cook
    discipline: cooking
    min_level: 23
    discover: {counter: craft.cooking, at_least: 1500}
    effect: BUFF
    params: {target: party, potions: ["DAMAGE_RESISTANCE:1:180"]}
    cooldown_minutes: 45
    source: ORIGINAL
    description: "몸속까지 차가워져 단단해진다 — 파티 3분 동안 강한 저항"
  lucky_pie:
    name: 행운의 파이
    job: cook
    discipline: cooking
    min_level: 26
    discover: {counter: craft.cooking, at_least: 1800}
    effect: BUFF
    params: {target: near, potions: ["LUCK:2:600", "HERO_OF_THE_VILLAGE:0:600"]}
    cooldown_minutes: 120
    source: ORIGINAL
    description: "한 조각에 하나씩 행운이 들어 있다 — 근처 모두 10분 동안 큰 행운 · 마을의 영웅 (상인이 값을 깎아 준다)"
