# 비기 (ART-01). 이름은 나무위키 「로열 로드」 §6 본문에 나온 것 (CANON). 배우는 방법 · 효과 수치는 이 게임의 것.
# 원작: 마스터 직전에 만드는 최상급 스킬. 비기에 관련된 물건(조각사는 조각상)으로 배우거나 스스로 깨우친다(정령창조 조각술).
#       직업의 비기를 모두 모으면 최후의 비기 — 조각사: 시간 조작(초급 시간 가속 · 중급 시간 정지 · 고급 시간 여행), 요리사: 천상의 맛.
# 화가의 '대륙 창조'는 이 게임에 화가 직업이 없어 넣지 않았다.
# relic: 손에 들고 배우면 사라지는 조각상 (던전의 숨은 보상) · discover: 스스로 깨우치는 조건 · cooldown_minutes: 다시 쓰기까지
arts:
  sculpt_life:
    name: 조각 생명술
    job: sculptor
    discipline: sculpting
    min_level: 25
    relic: relic_life_statue
    discover: {counter: craft.sculpting, at_least: 1500}
    effect: COMPANION
    cooldown_minutes: 30
    description: "손에 든 조각품에 생명을 불어넣는다 — 품질만큼 오래 곁에서 싸우는 조각 생명체 (조각품은 사라진다)"
  sculpt_transform:
    name: 조각 변신술
    job: sculptor
    discipline: sculpting
    min_level: 25
    relic: relic_transform_statue
    discover: {counter: art.experience, at_least: 2000}
    effect: TRANSFORM
    cooldown_minutes: 20
    description: "5분 동안 조각한 몸으로 변한다 — 힘 · 속도 · 도약이 오르고 이름이 가려진다. 변신 중에 쌓은 악명은 풀려도 남는다"
  sculpt_revival:
    name: 조각 부활술
    job: sculptor
    discipline: sculpting
    min_level: 27
    relic: relic_revival_statue
    effect: REVIVE
    cooldown_minutes: 60
    description: "10분 동안 나와 16 블록 안 파티원에게 부활의 가호 — 죽을 피해를 한 번 버티고 체력 절반으로 일어선다"
  spirit_creation:
    name: 정령창조 조각술
    job: sculptor
    discipline: sculpting
    min_level: 28
    discover: {all: [{counter: craft.sculpting, at_least: 3000}, {mastery: exploration, level: 15}]}
    effect: SPIRITS
    cooldown_minutes: 30
    description: "자연을 깎아 정령 셋을 만든다 — 10분 동안 나를 따라 싸운다 (원작: 위드가 스스로 깨우친 비기)"
  time_sculpting:
    name: 시간 조각술 (최후의 비기)
    job: sculptor
    discipline: sculpting
    min_level: 29
    final: true
    effect: TIME
    cooldown_minutes: 60
    description: "조각사의 최후의 비기. 숙련 29 초급 시간 가속(파티 1분 가속) · 30 중급 시간 정지(주변 몬스터 8초 정지) · 31 고급 시간 여행(1분 전 자리로)"
  heavenly_taste:
    name: 천상의 맛 (최후의 비기)
    job: cook
    discipline: cooking
    min_level: 31
    final: true
    discover: {counter: craft.cooking, at_least: 2000}
    effect: FEAST
    cooldown_minutes: 1440
    description: "요리사의 최후의 비기. 16 블록 안 모두에게 5분 동안 포만 · 재생 · 흡수, 먹은 사람은 하루에 한 번 인내 기록 +200 (영구 스탯)"
  # ---- 추가 비기 (이름 CANON — 나무위키 「로열 로드/스킬」 사용자 제공 본문. 배우는 조건 · 수치는 ORIGINAL)
  sculpting_swordsmanship:
    name: 조각 검술
    job: sculptor
    discipline: sculpting
    min_level: 20
    discover: {all: [{counter: craft.sculpting, at_least: 800}, {mastery: swordsmanship, level: 10}]}
    effect: BLADE
    cooldown_minutes: 2
    description: "조각칼로 허공을 깎듯 벤다 — 앞쪽 7 블록 부채꼴에 (12 + 예술 스탯 × 0.5) 피해"
  nature_sculpting:
    name: 대재앙의 자연조각술
    job: sculptor
    discipline: sculpting
    min_level: 27
    discover: {all: [{counter: craft.sculpting, at_least: 4000}, {mastery: exploration, level: 18}]}
    effect: DISASTER
    cooldown_minutes: 120
    description: "자연을 조각해 재앙을 부른다 — 30초 동안 폭풍, 주위 16 블록 몬스터에게 벼락 여섯 번 (건물 · 땅은 부수지 않음)"
  radiant_sword:
    name: 광휘의 검술
    job: swordsman
    discipline: swordsmanship
    min_level: 18
    discover: {all: [{mastery: swordsmanship, level: 18}, {counter: kill.monster, at_least: 3000}]}
    effect: RADIANT
    cooldown_minutes: 3
    description: "빛줄기 같은 일격 — 앞으로 14 블록 직선 위 모두에게 큰 피해, 언데드 · 악마는 두 배"
  split_sword:
    name: 분검술
    job: swordsman
    discipline: swordsmanship
    min_level: 22
    discover: {all: [{mastery: swordsmanship, level: 22}, {counter: hit.training, at_least: 5000}]}
    effect: SPLIT
    cooldown_minutes: 4
    description: "검을 여럿으로 나눠 휘두른다 — 주위 6 블록 모두를 세 번 벤다"
  honorable_oath:
    name: 명예로운 약속
    job: swordsman
    discipline: swordsmanship
    min_level: 20
    discover: {all: [{mastery: swordsmanship, level: 20}, {counter: fame, at_least: 1000}]}
    effect: OATH
    cooldown_minutes: 10
    description: "동료와 맹세한다 — 16 블록 안 파티원 1분 동안 힘 · 저항"
  the_other_sword:
    name: 다른 하나의 검
    job: swordsman
    discipline: swordsmanship
    min_level: 25
    discover: {all: [{mastery: swordsmanship, level: 25}, {counter: boss.field, at_least: 10}]}
    effect: TWIN
    cooldown_minutes: 15
    description: "보이지 않는 두 번째 검 — 30초 동안 내 근접 공격이 한 번 더 들어간다 (절반 피해)"
