# 비기 (ART-01). 이름은 나무위키 「로열 로드」 §6 본문에 나온 것 (CANON). 배우는 방법 · 효과 수치는 이 게임의 것.
# 원작: 마스터 직전에 만드는 최상급 스킬. 비기에 관련된 물건(조각사는 조각상)으로 배우거나 스스로 깨우친다(정령창조 조각술).
#       직업의 비기를 모두 모으면 최후의 비기 — 조각사: 시간 조작(초급 시간 가속 · 중급 시간 정지 · 고급 시간 여행), 요리사: 천상의 맛.
# 화가의 '대륙 창조'는 이 게임에 화가 직업이 없어 넣지 않았다.
# relic: 손에 들고 배우면 사라지는 조각상 (던전의 숨은 보상) · discover: 스스로 깨우치는 조건 · cooldown_minutes: 다시 쓰기까지
arts:
  sculpt_life:
    name: 조각 생명술
    job: sculptor
    discipline: sculpting
    min_level: 25
    relic: relic_life_statue
    discover: {counter: craft.sculpting, at_least: 1500}
    effect: COMPANION
    cooldown_minutes: 30
    description: "손에 든 조각품에 생명을 불어넣는다 — 품질만큼 오래 곁에서 싸우는 조각 생명체 (조각품은 사라진다)"
  sculpt_transform:
    name: 조각 변신술
    job: sculptor
    discipline: sculpting
    min_level: 25
    relic: relic_transform_statue
    discover: {counter: art.experience, at_least: 2000}
    effect: TRANSFORM
    cooldown_minutes: 20
    description: "5분 동안 조각한 몸으로 변한다 — 힘 · 속도 · 도약이 오르고 이름이 가려진다. 변신 중에 쌓은 악명은 풀려도 남는다"
  sculpt_revival:
    name: 조각 부활술
    job: sculptor
    discipline: sculpting
    min_level: 27
    relic: relic_revival_statue
    effect: REVIVE
    cooldown_minutes: 60
    description: "10분 동안 나와 16 블록 안 파티원에게 부활의 가호 — 죽을 피해를 한 번 버티고 체력 절반으로 일어선다"
  spirit_creation:
    name: 정령창조 조각술
    job: sculptor
    discipline: sculpting
    min_level: 28
    discover: {all: [{counter: craft.sculpting, at_least: 3000}, {mastery: exploration, level: 15}]}
    effect: SPIRITS
    cooldown_minutes: 30
    description: "자연을 깎아 정령 셋을 만든다 — 10분 동안 나를 따라 싸운다 (원작: 위드가 스스로 깨우친 비기)"
  time_sculpting:
    name: 시간 조각술 (최후의 비기)
    job: sculptor
    discipline: sculpting
    min_level: 29
    final: true
    effect: TIME
    cooldown_minutes: 60
    description: "조각사의 최후의 비기. 숙련 29 초급 시간 가속(파티 1분 가속) · 30 중급 시간 정지(주변 몬스터 8초 정지) · 31 고급 시간 여행(1분 전 자리로)"
  heavenly_taste:
    name: 천상의 맛 (최후의 비기)
    job: cook
    discipline: cooking
    min_level: 31
    final: true
    discover: {counter: craft.cooking, at_least: 2000}
    effect: FEAST
    cooldown_minutes: 1440
    description: "요리사의 최후의 비기. 16 블록 안 모두에게 5분 동안 포만 · 재생 · 흡수, 먹은 사람은 하루에 한 번 인내 기록 +200 (영구 스탯)"
