# 캐릭터 만들기 (CHR-01) — 처음 접속하면 종족 → 성별 → 시작 도시를 고른다. 한 번 고르면 바꿀 수 없다.
# 근거: 나무위키 「로열 로드」 §6 — 시작 종족 29 → 49가지(오크는 위드가 열었고 32권에 조인족 추가), 성별 남성 · 여성 · 중성,
#       스타팅 도시에서 소환되어 1달(게임 시간) 동안 성 · 도시 밖으로 못 나감, 그동안 사망 페널티 없음, 보리빵 10개.
# 원작에 49 종족 전체 목록은 없다 → 원작에 '시작 종족'으로 나온 다섯만 넣었다. 종족 보너스 수치는 ORIGINAL (작게, 확률 없음).
beginner_game_days: 30
starting_kit: ["barley_bread:400:10"]

races:
  human:    {name: 인간,   source: CANON, note: "가장 흔한 시작 종족. 어느 길로든 갈 수 있다",
             xp_bonus: {trading: 0.10, exploration: 0.05}, perk: none}
  elf:      {name: 엘프,   source: CANON, note: "숲과 활에 밝다",
             xp_bonus: {archery: 0.10, herbalism: 0.10}, perk: night_vision}
  dwarf:    {name: 드워프, source: CANON, note: "광산과 대장간의 종족",
             xp_bonus: {smithing: 0.10, mining: 0.10}, perk: none}
  orc:      {name: 오크,   source: CANON, note: "전설의 조각사도 한때 오크로 살았다고 전한다. 질긴 몸",
             xp_bonus: {swordsmanship: 0.05, spearmanship: 0.05}, perk: max_health}
  birdfolk: {name: 조인족, source: CANON, note: "하늘에 사는 종족 — 떨어져도 다치지 않는다",
             xp_bonus: {exploration: 0.10}, perk: no_fall_damage}

# 시작 도시: 원작 왕국의 수도 · 큰 도시 중 지금 지도에 도시로 있는 곳. 그 지역 안(하위 지역 포함)만 다닐 수 있다.
cities:
  serabourg:   {name: 세라보그 성,   region: serabourg,        kingdom: 로자임,   source: CANON, note: "전설의 조각사가 첫발을 디뎠다는 로자임의 수도. 기초 · 초급 수련관"}
  aren:        {name: 아렌 성,       region: aren_castle,      kingdom: 하벤,     source: CANON, note: "중앙 대륙 패권국 하벤의 수도. 투쟁의 길"}
  nehales:     {name: 네할레스 성,   region: nehales_bastion,  kingdom: 브렌트,   source: CANON, note: "로자임 북쪽 브렌트의 수도"}
  sisley:      {name: 시슬레 성,     region: sisley_castle,    kingdom: 브리튼 연합, source: CANON, note: "대륙 가운데 일곱 왕국 연합의 성"}
  hillshade:   {name: 힐쉐이드 성,   region: hillshade_castle, kingdom: 아이데른, source: CANON, note: "남쪽 바다를 낀 아이데른의 수도"}
  morata:      {name: 모라타,        region: morata_free_city, kingdom: 북부 (옛 아르펜), source: CANON, note: "옛날엔 변방이었다 — 후대에 북부 개척민의 첫 도시가 됨 (이 게임의 설정)"}
