  calamor_sword: {name: "칼라모르의 검", category: WEAPON, material: IRON_SWORD, durability: 650, weight: 5, tags: [sword], stats: {attack: 16, crit: 4, vs_human: 5}, requires: {mastery.swordsmanship: 8}, source: CANON,
