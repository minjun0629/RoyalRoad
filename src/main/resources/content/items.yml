  red_star: {name: "레드 스타", category: WEAPON, material: NETHERITE_SWORD, durability: 2100, weight: 5, tags: [sword, dragonbone], stats: {attack: 38, fire: 10, crit: 8, pierce: 10, vs_large: 15}, requires: {mastery.swordsmanship: 22}, source: CANON,
