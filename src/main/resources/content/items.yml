  lu_divine_sword: {name: "루의 신검", category: WEAPON, material: GOLDEN_SWORD, durability: 1400, weight: 4, tags: [sword, broad], stats: {attack: 36, holy: 14, vs_undead: 35, vs_demon: 35, regen: 1}, requires: {mastery.swordsmanship: 20, fame: 600}, source: CANON,
