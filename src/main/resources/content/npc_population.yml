# 주민 생성 규칙 (NPC-03, ORIGINAL). npcs.yml 의 손으로 만든 NPC 와 함께, 지역 성격(태그)에 맞는 주민을 결정적으로 만들어 넣는다.
# 같은 콘텐츠 = 같은 주민 (이름 · 가족 · 자리 · 상점 · 의뢰가 서버를 다시 켜도 같다). 플레이어별 관계 · 기억은 DB.
#
# archetypes: 직업 틀
#   services: SHOP 상점 · REPAIR 수리 · INN 쉼(체력 · 허기) · HEAL 치유(독 · 시듦) · TRAIN 숙련 지도 · RUMOR 소문 · SONG 노래(이동 · 재생)
#             AUCTION 경매장 · LORE 연대기 · QUEST 의뢰 (모두 실제로 동작)
#   schedule: "시작-끝:장소" — 장소 키 work · home · market · tavern · square · temple · gate · yard(훈련장 문 앞)
#   gifts: 처음 온 사람에게 한 번 주는 것 (GIFT) "아이템:품질:개수" · 바닐라 물건은 "minecraft:arrow:64" — 직업 틀마다 한 사람에 한 번
#   stock: 파는 물건 "아이템:품질" · buys: 사 주는 태그 · produces / consumes: 지역 경제(공급 · 수요)에 더하는 태그
#   lines: [낯섦, 보통, 가까움] 한 줄 대사 · trains: TRAIN 이 가르치는 숙련 분야
#   quests: 의뢰 틀 — target: "item:<id>" · "kill:<엔티티|any>" · "partner"(관계 있는 NPC 에게 전하기) · "ruin"(가까운 유적 찾기) · "craft:<분야>"
#           hidden: true 면 목록에 없고, 그 NPC 와 '신뢰' 단계가 되면 열린다
