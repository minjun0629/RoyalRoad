  - {id: frozen,    tags: [frozen],                         weights: {snow: 5, blizzard: 2, clear: 3, fog: 1}}
  - {id: mountain,  tags: [mountain, highland, volcano],    weights: {clear: 4, cloudy: 3, fog: 2, snow: 2, storm: 1}}
  - {id: maritime,  tags: [sea, coast, lake, river, swamp, mist], weights: {clear: 3, cloudy: 3, rain: 3, fog: 2, storm: 2}}
  - {id: temperate, tags: [],                               weights: {clear: 6, cloudy: 3, rain: 3, storm: 1, fog: 1}}
