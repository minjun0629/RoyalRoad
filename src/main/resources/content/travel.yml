# 마차 · 배 노선은 지역에서 자동으로 만든다. 마부(마차) · 선장(배) NPC 에게 표를 산다.
#   links: 도시마다 이을 가까운 곳 수 · max_distance: 이보다 먼 곳은 잇지 않음
#   fare: base + 거리 × per_block · 걸리는 시간 = 거리 ÷ blocks_per_second (실제 시간). 여행 중에는 움직이지 못하고, 끊겨도 도착 시각이 지나면 도착지에서 깨어난다
#   port_range: 바다 지역에서 이만큼 안의 도시는 항구
carriage: {links: 3, max_distance: 4000, base: 20, per_block: 0.04, blocks_per_second: 30}
ship:     {links: 4, max_distance: 16000, base: 120, per_block: 0.03, blocks_per_second: 60}
port_range: 900
