# VersaEra 설정. 콘텐츠(아이템 · 레시피 · 지역 · NPC · 보스 · 퀘스트 · 던전 · 시장 · 이벤트)는 plugins/VersaEra/content/*.yml 에서 고칩니다.
timezone: Asia/Seoul   # 하루 단위 규칙(NPC 대화 · 일일 의뢰)의 날짜 기준

# 리소스팩
#  - 기본: GitHub 저장소 minjun0629/RoyalRoad 맨 위의 VersaEra-ResourcePack.zip 을 플레이어가 GitHub 에서 직접 받는다
#          → 서버 포트를 열 필요 없고, 어느 IP 의 플레이어든 받을 수 있다. SHA-1 은 서버가 직접 받아 계산 (적을 필요 없음)
#  - urls: 다른 곳에 올린 팩을 먼저 쓰고 싶을 때만 적는다 (위에서부터, 그다음 기본 주소)
#  - github: false 면 GitHub 를 쓰지 않고 코드로 만든 팩을 내장 HTTP 서버(port)로 내려 준다 (방화벽에서 port 를 열거나 public-url 지정)
#  - required: true 면 팩을 거절한 사람은 접속할 수 없다
pack:
  enabled: true
  github: true
  urls: []
  required: false
  prompt: "VersaEra 전용 리소스팩 (아이템 · 보스 · 메뉴 그림)"
  port: 8173
  public-url: ""   # 내장 서버를 쓸 때 외부 주소 (비우면 http://<server-ip>:<port>/versaera.zip)
  menu-background: true   # 메뉴 제목에 팩 배경 글자를 깐다 (팩을 거부한 사람에겐 네모로 보임)

# 배고픔 (원작: 시간이 지나면 배가 고프고, 굶으면 힘이 빠진다)
#  hours_per_meal: 배부른 상태가 바닥나기까지 게임 시간 (time.ratio 4 면 게임 1시간 = 현실 15분 → 8 = 현실 2시간)
#  activity_scale: 뛰고 싸워서 줄어드는 바닐라 소모를 이만큼만 (1 = 바닐라 그대로)
hunger:
  enabled: true
  hours_per_meal: 8
  activity_scale: 0.2   # 달리기 · 싸움 · 체력 회복으로 쓰는 바닐라 소모 배율 (1 = 바닐라)

# 세계 복구: 산 땅 밖에서 부수거나(폭발 · 불 포함) 놓은 블록이 delay_seconds 뒤 원래대로 돌아온다.
#  자원 블록은 채집 규칙대로 따로 되살아나고, 크리에이티브 모드는 복구하지 않는다 (관리자 건축)
#  drops: false 면 복구되는 블록은 아이템을 떨어뜨리지 않는다 (무한 채집 방지)
restore:
  enabled: true
  delay_seconds: 2
  drops: false

# 들판 몬스터: 지역 위험도에 맞춰 사람 둘레(도시 성벽 밖)에 나온다. 위험도 0 = 토끼 · 여우, 1 = + 늑대, 2 이상 = 늑대 무리 · 거미 · 고블린 …
field-mobs:
  enabled: true

# 기본 세계를 VersaEra 지형으로 (bukkit.yml 의 worlds.<level-name>.generator 를 플러그인이 자동으로 채운다. 끄려면 false)
world:
  auto-generator: true

# 지형 생성기: bukkit.yml 에
#   worlds:
#     world:
#       generator: VersaEra
# 를 적고 새 세계를 만들면 regions.yml 에 맞는 땅이 생깁니다 (기존 세계에는 새 청크에만 적용).

# 다른 차원 세계 (versa_realms) — 거인계 · 신계 · 정령계 · 요정계 · 마계 · 악마계 · 지옥 · 토둠. 문(content/gates.yml)으로만 오간다.
realms:
  enabled: true

# 원작 규칙 (나무위키 「로열 로드」 §3 · §6)
time:
  # 게임 시간 배율. 4 = 원작 (현실 하루 = 게임 4일, 낮밤 한 번 = 현실 6시간). 0 = 마인크래프트 기본 낮밤(20분)
  ratio: 4
beginner:
  # 초보 기간(게임 30일 = 현실 약 7.5일)에는 시작 도시와 성벽 밖 96 블록 사냥터 밖으로 못 나간다. false 면 어디든 (관리자는 늘 자유)
  confine: true
death:
  # canon = 원작: 숙련도 하락 (레벨은 그대로) · 행동 스탯 하락 · 무작위 아이템 드롭 (초보 기간 제외). 접속 제한은 없다
  # soft  = 완화판: 지금 단계 진행도만 감소 · 드롭 없음
  mode: canon

# 대륙을 처음 통일한 황제국(수도 6곳을 모두 가진 나라)의 길드 금고에 주는 상금 (골드). 원작의 현실 상금 대신
emperor:
  reward_gold: 10000   # 골드 (1 골드 = 100 실버 = 10000 쿠퍼)
