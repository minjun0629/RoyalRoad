    category: 인프라
    source: 04_ARCHITECTURE §8-9
    source_type: 설계 요구
    classification: ORIGINAL
    description: SQLite 연결 하나 · 중첩 트랜잭션 · 버전별 마이그레이션 · 적용 파일 해시 검증
    player_experience: 재시작 · 업데이트 뒤에도 기록이 그대로
    dependencies: []
    implementation: persistence.Database · Migrator · SqlTxRunner
    data_model: schema_version
    ui: 없음
    resource_pack: 없음
    performance_risk: SQLite 쓰기 1개 — 전용 스레드로 직렬화. 대형 서버는 PostgreSQL 이전 필요 (Dialect 분리 예정)
    security_risk: 이미 적용한 마이그레이션 수정 시 시작 거부
    persistence: 파일 DB (WAL)
    tests: [MigratorTest]
