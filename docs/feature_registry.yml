  - id: ITM-02
    feature: 배달함 (안전한 지급)
    category: 아이템 · 보안
    source: 요구 §39 · §41
    source_type: 설계 요구
    classification: ORIGINAL
    description: 모든 지급은 배달함 경유. 고유 = 넣고 → 확정(거부 시 회수), 묶음 = 지우고 → 지급. 서버가 중간에 꺼져도 사라지거나 두 개가 되지 않음
    player_experience: 가방이 차면 나중에 자동으로 받음
    dependencies: [ITM-01]
    implementation: ItemService.pendingDeliveries · confirmDelivered · takeBulk · SessionListener.deliver
    data_model: item_instance.custody = DELIVERY · delivery_bulk
    ui: "받음: <이름>"
    resource_pack: 없음
    performance_risk: 10초마다 접속자 배달 확인 (DB 스레드)
    security_risk: 중복 확정 · 중복 수령 방지 (테스트)
    persistence: DB
    tests: [ItemServiceTest]
    server_test: BLOCKED
    status: IMPLEMENTED

  - id: ITM-03
    feature: 인벤토리 검증 · 격리 (복제 방지)
    category: 보안
    source: 요구 §40 · §59
    source_type: 설계 요구
    classification: ORIGINAL
    description: "접속 · 2초마다 한 명씩 인벤토리 · 엔더 상자의 고유 아이템을 DB 와 대조 (위조 · 파괴됨 · 남의 것 · 보관 중 · 같은 id 두 개 → 회수 + 감사 로그). 고유 아이템은 플레이어 밖으로 나갈 수 없음: 버리기 · 상자 · 화로 · 호퍼 · 액자 · 갑옷 거치대 금지 → 검사되지 않는 곳에 복제품을 숨길 수 없고, 넘기는 길은 서버가 검증하는 거래 · 경매뿐. 줍기 · 손에 들기 · 손 바꾸기 때 곧바로(5초에 한 번) 다시 검사, 전투 수치는 DB 소유 확인된 아이템만"
    player_experience: "(정상 플레이어는 느끼지 못함)"
    dependencies: [ITM-01]
    implementation: "platform.bukkit.listener.InventoryGuard · CustodyGuard · ItemService.validate · CombatListener(소유 확인 캐시)"
    data_model: 없음
    ui: "확인되지 않은 아이템 N개를 회수했습니다"
    resource_pack: 없음
    performance_risk: 한 번에 한 명 · 2초 간격
    security_risk: "검사 주기 사이 짧은 창은 남지만, 복제품은 플레이어 밖으로 옮기거나 넘길 수 없고 사용 시점(거래 · 경매 · 전투 수치)은 서버가 검증"
    persistence: 없음
    tests: [ItemServiceTest]
    server_test: BLOCKED
    status: IMPLEMENTED

