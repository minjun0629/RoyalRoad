  - id: RP-01
    feature: "리소스팩 (코드로 생성 · 배포)"
    category: "리소스팩"
    source: "요구 §51-52"
    source_type: "설계 요구"
    classification: ORIGINAL
    description: "ResourcePackBuilder 가 서버를 켤 때 팩을 만든다: 거대 보스 5종 큐브 모델(거상 · 날개 짐승 · 결정 · 마디 벌레 · 갑각 템플릿) + 절차 텍스처(등 약점 표시) · 모든 아이템 종류의 32×32 아이콘(PixelArt + Canvas: 색상을 비튼 5단계 색 사다리 · 왼쪽 위 빛 자동 음영 · 색 외곽선 — 검 · 단검 · 도끼 · 창 · 활 · 지팡이 · 갑옷 부위 · 원석 · 주괴 · 보석 · 목재 · 천 · 가죽 · 약초 · 생선 · 물약 · 조각상 …, 능력 속성색 · 원작 물건 금빛 표시)을 바닐라 재질 모델의 CustomModelData 로(방패 · 삼지창은 바닐라 렌더러라 제외). 무기 · 도구 · 투구 · 물약 · 주괴 · 보석 · 원석 · 통나무 · 빵 · 고기 · 뼈 · 조각상 등은 상자를 깎아 쌓은 입체 모델(Sculpt — 빗각 날 · 코등이 · 감은 손잡이 · 보주 · 둥근 팔각 투구 · 뿔 · 가시, 기울인 상자 포함). 입체 투구는 투구 재질이 아니어서 머리에 3D 그대로 보이고, 쓰기는 HeadGear 가 대신 (우클릭 · 투구 칸 · 쉬프트 클릭) · 입은 갑옷은 갑옷 장식(trim) 무늬로 아이템 · 세트마다 다른 겉모습(128×64, 판금 · 사슬 · 비늘 · 털가죽 · 로브 + 투구 T자 가리개 · 가슴 문장 · 깃 · 허리띠 · 어깨받이 · 무릎받이 · 장화 목, 플러그인이 데이터팩을 세계 datapacks 에 설치 — 처음 한 번 재시작) · 필드 보스 16종 관절 모델(ModelKit: 겹 어깨받이 · 허리 갑판 · 휜 뿔 · 등 가시 · 송곳니 · 발톱 등 기울인 상자로 입체감, 기사 · 뱀파이어 · 리치 · 악마 · 용 · 짐승 · 골렘 · 히드라 · 불도마뱀 · 비행체 뼈대, 부위마다 상자 면을 한 장에 펼친 텍스처 · 결 · 얼굴 · 문장, 보스마다 색 변주) — 바닐라 몸은 숨기고 부위별 ItemDisplay 를 태워 관절을 보간으로 돌린다(걷기 · 날갯짓 · 꼬리 · 무기 휘두르기 · 물기) · 거대 보스 5종도 같은 방식 텍스처 · 철인의 쇠 가면, 메뉴 배경(1 ~ 6줄 모두, 금빛 테두리 · 모서리 장식 · 우묵한 칸 · 인벤토리 칸까지) · 공백 글꼴. 같은 콘텐츠 = 같은 SHA-1. gradle buildPack 으로 pack/VersaEra-pack.zip 을 만들어 GitHub 에 올리고, 서버는 pack.urls(raw 주소)에서 받아 SHA-1 을 계산해 보냄. 외부 주소가 모두 실패하면 내장 HTTP 서버로 배포. 손으로 그린 고급 모델은 아님 (교체 가능)"
    player_experience: "고유한 외형"
    dependencies: []
    implementation: "io.versaera.pack.ResourcePackBuilder · PackMain · domain.pack.PackIds · platform.bukkit.pack.ExternalPack · PackSender · PackServer"
    data_model: "없음"
    ui: "거부 시 안내 한 줄"
    resource_pack: "전부 코드 생성 (외부 에셋 · RpgCraft 팩 미사용)"
    performance_risk: "팩 약 수십 KB"
    security_risk: "팩 서버는 GET /versaera.zip 하나만"
    persistence: "없음"
    tests: [ResourcePackBuilderTest, ExternalPackTest]
    server_test: BLOCKED
    status: IMPLEMENTED

