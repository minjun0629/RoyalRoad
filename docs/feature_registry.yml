  - id: TRD-02
    feature: "지역 경매장 · NPC 상점 · 지역 시세"
    category: "경제"
    source: "원작 경제 세부 미확인 → 후대 설계"
    source_type: "설계 요구"
    classification: ORIGINAL
    description: "시장 6곳(market.yml). 경매장은 시장마다 따로: 고유 아이템은 ESCROW(auction:<id>), 묶음 재료는 인벤토리에서 빼서 등록, 구매는 OPEN→SOLD 조건부 갱신으로 한 명만 성공, 수수료(상인 직업 감면), 48시간 만료 → 배달함. NPC 상점: 지역(흔함 ×0.8 · 귀함 ×1.3) · 공급(판 만큼 값 하락, 시간마다 회복) · 품질로 값이 정해지고, 판매가 ×1.25 / 매입가 ×0.6 이라 되팔기 이득이 없다. 대상단 이벤트 할인"
    player_experience: "지역마다 싸고 비싼 것이 달라 교역할 이유가 생김"
    dependencies: [TRD-01, ECO-01, NPC-01]
    implementation: "domain.market.MarketPricing · MarketCatalog · application.MarketService · AuctionService · NpcMenus(상점) · /경매"
    data_model: "auction_listing · market_supply · content/market.yml"
    ui: "NPC 창 → 상점 (클릭 1개 · 쉬프트 16개 · 손에 든 것 팔기), /경매 (목록 · 등록 · 내리기)"
    resource_pack: "없음"
    performance_risk: "경매 검색은 (state, market, type) 인덱스 · 만료는 10분마다 50건"
    security_risk: "구매 경쟁은 조건부 UPDATE · 돈 · 수수료 · 아이템 이동은 한 트랜잭션 · 같은 요청 키 반복 무시"
    persistence: "DB"
    tests: [MarketAuctionTest, ContentIntegrityTest]
    server_test: BLOCKED
    status: IMPLEMENTED

